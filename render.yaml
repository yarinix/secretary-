services:
  - type: web
    name: secretary-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      # Историческое название: здесь лежит ключ GEMINI, Claude не подключён.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODELS
        sync: false
      - key: OWNER_NAME
        sync: false
      - key: BOT_TIMEZONE
        sync: false
      - key: BUSINESS_MAX_REPLIES_PER_HOUR
        sync: false
      # Умные отложенные ответы. ВСЕ необязательны: дефолты заданы в config.py,
      # а источник истины после первого сохранения — БД (Mini App).
      - key: BUSINESS_SMART_REPLIES
        sync: false
      - key: BUSINESS_REPLY_DELAY_MINUTES
        sync: false
      - key: BUSINESS_AWAY_MINUTES
        sync: false
      - key: BUSINESS_AWAY_COLLECT_SECONDS
        sync: false
      - key: BOT_NIGHT_ENABLED
        sync: false
      - key: BOT_NIGHT_START
        sync: false
      - key: BOT_NIGHT_END
        sync: false
      - key: BOT_NIGHT_HINT
        sync: false
      - key: BUSINESS_IGNORE_IDS
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      # Внешний Postgres: настройки Mini App переживают рестарт/сон Free-сервиса.
      # DSN от Supabase / Neon / Render Postgres вида postgresql://...
      - key: DATABASE_URL
        sync: false
      # Отдельный machine-to-machine секрет для POST /internal/seen.
      # Пусто -> приёмник не регистрируется и фича выключена (безопасно).
      # Должен совпадать с SECRETARY_SEEN_SECRET у отдельного seen_watcher.py.
      # НЕ задавайте здесь TELEGRAM_SESSION: watcher живёт в другом процессе.
      - key: SEEN_WEBHOOK_SECRET
        sync: false
      # RENDER_EXTERNAL_URL Render подставляет автоматически; при необходимости
      # можно задать WEBHOOK_BASE_URL вручную (sync: false).
